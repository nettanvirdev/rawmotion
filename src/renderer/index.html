<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- `rawmotion-asset:` is how project media reaches the preview: the
         main process serves it through a custom protocol that enforces the
         project sandbox (see main.js). `file:` stays for older URLs and
         packaged-page relative loads. `connect-src` includes the scheme
         because Remotion's media handling fetches audio for waveforms. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: rawmotion-asset:; media-src 'self' blob: file: rawmotion-asset:; font-src 'self' data: rawmotion-asset:; connect-src 'self' rawmotion-asset:"
    />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <title>Raw Motion</title>
    <!-- Theme flash guard. Render-blocking and external, because the CSP
         above is `script-src 'self'` - an inline script would be blocked. -->
    <script src="./theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
