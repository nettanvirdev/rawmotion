<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hello World!</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #9feaf9;
        background: transparent;
        overflow: hidden;
      }

      /* App container with rounded corners */
      .app {
        height: calc(100% - 2px);
        margin: 1px;
        background: #2b2e3b;
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Draggable titlebar area (native window dragging) */
      .titlebar {
        height: 32px;
        min-height: 32px;
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-left: 14px;
        background: #1e2029;
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
        user-select: none;
      }

      .titlebar-content {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .titlebar-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .titlebar-title {
        font-size: 12px;
        font-weight: 400;
        color: #9feaf9;
        opacity: 0.9;
      }

      /* Window controls */
      .window-controls {
        display: flex;
        -webkit-app-region: no-drag;
        height: 100%;
      }

      .window-btn {
        width: 46px;
        height: 100%;
        border: none;
        background: transparent;
        color: #9feaf9;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.12s;
      }

      .window-btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .window-btn.close {
        border-top-right-radius: 10px;
      }

      .window-btn.close:hover {
        background: #e81123;
        color: white;
      }

      .window-btn svg {
        width: 11px;
        height: 11px;
      }

      .content {
        padding: 24px 28px;
        flex: 1;
        overflow: auto;
      }

      .content h1 {
        font-size: 32px;
        font-weight: 600;
        margin-bottom: 12px;
      }

      .content p {
        opacity: 0.85;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="titlebar">
        <div class="titlebar-content">
          <svg
            class="titlebar-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <line x1="15" y1="3" x2="15" y2="21"></line>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="3" y1="15" x2="21" y2="15"></line>
          </svg>
          <span class="titlebar-title">Hello Electron!</span>
        </div>
        <div class="window-controls">
          <button class="window-btn" id="minimize-btn" title="Minimize">
            <svg width="11" height="1" viewBox="0 0 11 1">
              <rect fill="currentColor" width="11" height="1" />
            </svg>
          </button>
          <button class="window-btn" id="maximize-btn" title="Maximize">
            <svg width="10" height="10" viewBox="0 0 10 10">
              <rect
                fill="none"
                stroke="currentColor"
                stroke-width="1"
                x="0.5"
                y="0.5"
                width="9"
                height="9"
              />
            </svg>
          </button>
          <button class="window-btn close" id="close-btn" title="Close">
            <svg width="10" height="10" viewBox="0 0 10 10">
              <path
                stroke="currentColor"
                stroke-width="1.1"
                d="M1,1 L9,9 M9,1 L1,9"
              />
            </svg>
          </button>
        </div>
      </div>
      <div class="content">
        <h1>Hello Electron!</h1>
        <p>Build cross-platform desktop apps with JavaScript, HTML, and CSS</p>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
