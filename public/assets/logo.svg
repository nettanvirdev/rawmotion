<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Raw Motion app mark.

    Three layers, in the modern app-icon idiom:
      1. a solid squircle plate sitting on a soft drop shadow
      2. a frosted-glass video frame floating on the plate
      3. a solid white play glyph - the only fully opaque shape, so the icon
         still reads at 16px once the glass detail dissolves

    This file is the source of truth. `npm run icons` rasterises it into
    public/assets/logo.png and every packaging asset.
  -->
  <defs>
    <filter id="plateShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" />
    </filter>

    <filter id="glyphShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" />
    </filter>

    <linearGradient id="plate" x1="176" y1="176" x2="848" y2="848" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#6025d9" />
    </linearGradient>

    <!-- Light rakes across the top of the plate, the way a real surface would. -->
    <linearGradient id="plateSheen" x1="512" y1="176" x2="512" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glass" x1="272" y1="336" x2="752" y2="688" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16" />
    </linearGradient>

    <linearGradient id="glassEdge" x1="272" y1="336" x2="752" y2="688" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <!-- 1. Plate -->
  <rect x="176" y="212" width="672" height="672" rx="196" fill="#3f1d8f" opacity="0.32" filter="url(#plateShadow)" />
  <rect x="176" y="176" width="672" height="672" rx="196" fill="url(#plate)" />
  <rect x="176" y="176" width="672" height="672" rx="196" fill="url(#plateSheen)" />

  <!-- 2. Frosted video frame -->
  <rect x="272" y="336" width="480" height="352" rx="56" fill="url(#glass)" />
  <rect x="273.5" y="337.5" width="477" height="349" rx="54.5" fill="none" stroke="url(#glassEdge)" stroke-width="3" />

  <!-- 3. Play glyph. Corners are rounded via a round-joined stroke of the
       same paint, which expands the triangle by half the stroke width.
       Bounding box is centred on the frame with a small rightward optical
       nudge, since a triangle's visual mass sits left of its bbox centre. -->
  <g>
    <path d="M444 424 L588 508 L444 592 Z" fill="#2c0f6b" opacity="0.20"
          stroke="#2c0f6b" stroke-width="32" stroke-linejoin="round" filter="url(#glyphShadow)" />
    <path d="M444 420 L588 504 L444 588 Z" fill="#ffffff"
          stroke="#ffffff" stroke-width="32" stroke-linejoin="round" />
  </g>
</svg>
